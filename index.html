<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wangari Reader's Theater</title>
<meta name="theme-color" content="#2f6b3a">
<style>
  :root {
    --bg: #f4f7f1;
    --card: #ffffff;
    --ink: #1f2a1f;
    --muted: #5d6b5d;
    --line: #dfe7da;
    --brand: #2f6b3a;
    --brand-ink: #ffffff;
    --active: #e5f3df;
    --mine: #fff4d6;
    --narrator: #6b5b95;
    --wangari: #d9572b;
    --mama: #c2407a;
    --friend: #2b7fd9;
    --trees: #2f8a3e;
    --all: #8a6d1f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121712; --card: #1b221b; --ink: #e6ede4; --muted: #9fae9d; --line: #2c372b;
      --brand: #4f9a5c; --active: #22351f; --mine: #3a3218;
      --narrator: #a597d4; --wangari: #f08a60; --mama: #e57aa9; --friend: #6fb0f5; --trees: #6cc47a; --all: #d6b55a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121712; --card: #1b221b; --ink: #e6ede4; --muted: #9fae9d; --line: #2c372b;
    --brand: #4f9a5c; --active: #22351f; --mine: #3a3218;
    --narrator: #a597d4; --wangari: #f08a60; --mama: #e57aa9; --friend: #6fb0f5; --trees: #6cc47a; --all: #d6b55a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Noto Sans TC", sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header { padding: 20px 16px 8px; max-width: 860px; margin: 0 auto; }
  h1 { margin: 0; font-size: clamp(22px, 5vw, 30px); color: var(--brand); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .tabs {
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px; max-width: 860px; margin: 0 auto;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: 0 0 auto; border: 1px solid var(--line); background: var(--card); color: var(--ink);
    padding: 8px 14px; border-radius: 999px; font-size: 15px; cursor: pointer;
  }
  .tab[aria-selected="true"] { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }

  .bar {
    position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
  }
  .controls {
    max-width: 860px; margin: 0 auto; padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
  }
  .btn {
    border: 0; border-radius: 12px; padding: 10px 16px; font-size: 16px; font-weight: 600; cursor: pointer;
    background: var(--brand); color: var(--brand-ink); min-height: 44px;
  }
  .btn.secondary { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .field { display: flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); }
  select:disabled { opacity: .5; }
  select {
    font-size: 15px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); min-height: 40px;
  }

  main { max-width: 860px; margin: 0 auto; padding: 12px 16px 80px; }
  .scene-title { margin: 6px 0 2px; font-size: clamp(19px, 4vw, 24px); }
  .scene-zh { margin: 0 0 14px; color: var(--muted); }
  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .line {
    display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px;
    cursor: pointer; transition: background .15s, border-color .15s;
  }
  .line:hover { border-color: var(--brand); }
  .line.playing { background: var(--active); border-color: var(--brand); box-shadow: 0 0 0 2px var(--brand) inset; }
  .line.mine { background: var(--mine); }
  .line.missing { opacity: .5; cursor: default; }
  .who {
    font-size: 13px; font-weight: 700; color: #fff; padding: 3px 10px; border-radius: 999px;
    white-space: nowrap; margin-top: 2px; background: var(--c, var(--muted));
  }
  .text { font-size: clamp(17px, 2.6vw, 20px); }
  .cue { grid-column: 2; font-size: 13px; color: var(--muted); display: none; }
  .line.mine.playing .cue { display: block; }
  @media (max-width: 520px) {
    .line { grid-template-columns: 1fr; }
    .who { justify-self: start; }
    .cue { grid-column: 1; }
  }
</style>
</head>
<body>
<header>
  <h1 id="title">Wangari and the Little Green Tree</h1>
  <p>點句子播放單句，或按「播放本場景」連續播放。選「我的角色」練習時，輪到你的台詞會留白讓你唸。</p>
</header>
<div class="tabs" id="tabs" role="tablist"></div>
<div class="bar">
  <div class="controls">
    <button class="btn" id="toggle">▶ 播放本場景</button>
    <label class="field">速度
      <select id="speed">
        <option value="0.75">0.75×</option>
        <option value="0.9">0.9×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
      </select>
    </label>
    <label class="field">我的角色
      <select id="role"><option value="">（無，全部播放）</option></select>
    </label>
  </div>
</div>
<main>
  <h2 class="scene-title" id="sceneTitle"></h2>
  <p class="scene-zh" id="sceneZh"></p>
  <ol id="lines"></ol>
</main>
<audio id="player" preload="auto" playsinline></audio>
<script src="audio/manifest.js"></script>
<script>
(() => {
  const M = window.MANIFEST;
  const $ = id => document.getElementById(id);
  const audio = $("player");
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  if (!M) {
    $("sceneTitle").textContent = "找不到 audio/manifest.js，請先執行 generate.py";
    return;
  }
  $("title").textContent = M.title;

  let sceneIdx = Math.max(0, M.scenes.findIndex(s => s.id === store.get("scene")));
  let run = 0;          // incremented to cancel any in-flight sequence
  let waitTimer = null;
  let playing = false;

  M.roles.forEach(r => $("role").add(new Option(r.label, r.id)));
  $("role").value = store.get("role") || "";
  $("speed").value = store.get("speed") || "1";
  if (!$("speed").value) $("speed").value = "1";

  // Speed only changes while stopped, so the rate is set once as the default
  // and every clip starts at it instead of being re-rated mid-load.
  function applySpeed() {
    const rate = parseFloat($("speed").value);
    audio.defaultPlaybackRate = rate;
    audio.playbackRate = rate;
    audio.preservesPitch = true;
  }
  applySpeed();

  function setPlaying(on) {
    playing = on;
    $("speed").disabled = on;
    $("toggle").textContent = on ? "■ 停止" : "▶ 播放本場景";
  }

  const isMine = line => {
    const r = $("role").value;
    return r && (line.who.includes(r) || line.who.includes("all"));
  };

  function renderTabs() {
    $("tabs").innerHTML = "";
    M.scenes.forEach((s, i) => {
      const b = document.createElement("button");
      b.className = "tab";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", i === sceneIdx);
      b.textContent = s.id === "end" ? "Ending" : `Scene ${i + 1}`;
      b.onclick = () => { stop(); sceneIdx = i; store.set("scene", s.id); renderTabs(); renderScene(); };
      $("tabs").appendChild(b);
    });
  }

  function renderScene() {
    const s = M.scenes[sceneIdx];
    $("sceneTitle").textContent = s.title;
    $("sceneZh").textContent = s.titleZh;
    const ol = $("lines");
    ol.innerHTML = "";
    s.lines.forEach((line, i) => {
      const li = document.createElement("li");
      li.className = "line" + (line.src ? "" : " missing") + (isMine(line) ? " mine" : "");
      const who = document.createElement("span");
      who.className = "who";
      who.style.setProperty("--c", `var(--${line.who.length > 1 ? "all" : line.who[0]})`);
      who.textContent = line.label;
      const text = document.createElement("span");
      text.className = "text";
      text.textContent = line.text;
      const cue = document.createElement("span");
      cue.className = "cue";
      cue.textContent = "🎤 換你唸！";
      li.append(who, text, cue);
      li.onclick = () => { if (line.src) playLine(i); };
      ol.appendChild(li);
    });
  }

  function highlight(i) {
    [...$("lines").children].forEach((li, n) => li.classList.toggle("playing", n === i));
    const li = $("lines").children[i];
    if (li) li.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  function stop() {
    run++;
    clearTimeout(waitTimer);
    audio.pause();
    highlight(-1);
    setPlaying(false);
  }

  function playSrc(src, token) {
    return new Promise(resolve => {
      audio.src = src;
      audio.onended = () => resolve(token === run);
      audio.onerror = () => resolve(token === run);
      audio.play().catch(() => resolve(false));
    });
  }

  function wait(ms, token) {
    return new Promise(resolve => { waitTimer = setTimeout(() => resolve(token === run), ms); });
  }

  async function playLine(i) {
    stop();
    const token = run;
    setPlaying(true);
    highlight(i);
    await playSrc(M.scenes[sceneIdx].lines[i].src, token);
    if (token === run) stop();
  }

  async function playScene() {
    stop();
    const token = run;
    setPlaying(true);
    const lines = M.scenes[sceneIdx].lines;
    for (let i = 0; i < lines.length; i++) {
      const line = lines[i];
      if (!line.src) continue;
      highlight(i);
      const ok = isMine(line)
        ? await wait((line.dur * 1.3 / audio.defaultPlaybackRate + 0.8) * 1000, token)
        : await playSrc(line.src, token);
      if (!ok) return;
      if (!(await wait(350, token))) return;
    }
    if (token === run) stop();
  }

  $("toggle").onclick = () => (playing ? stop() : playScene());
  $("speed").onchange = () => { store.set("speed", $("speed").value); applySpeed(); };
  $("role").onchange = () => { store.set("role", $("role").value); renderScene(); };

  renderTabs();
  renderScene();
})();
</script>
</body>
</html>
